<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B1036">
<title>빛의 정원 — LUMIÈRE GARDEN · MEDIA ART 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="brand.css">
</head>
<body class="home">

<header class="nav">
  <a class="logo" href="index.html">빛의 정원</a>
  <nav class="menu" aria-label="주요 메뉴">
    <a href="index.html" aria-current="page">홈</a>
    <a href="artists.html">작가</a>
    <a href="gallery.html">갤러리</a>
    <a href="info.html">관람안내</a>
  </nav>
</header>

<main class="hero">
  <img class="hero__img" src="hero.webp" alt="">
  <div class="lights" aria-hidden="true">
    <span style="--x:7%;--y:20%;--s:17vmin;--dur:8s;--delay:0s;--peak:.85;--glow:var(--glow-a)"></span>
    <span style="--x:21%;--y:64%;--s:12vmin;--dur:6.5s;--delay:1.4s;--peak:.7;--glow:var(--glow-b)"></span>
    <span style="--x:34%;--y:11%;--s:10vmin;--dur:9s;--delay:3.1s;--peak:.6;--glow:var(--glow-a)"></span>
    <span style="--x:77%;--y:19%;--s:15vmin;--dur:7.5s;--delay:.8s;--peak:.8;--glow:var(--glow-a)"></span>
    <span style="--x:89%;--y:57%;--s:13vmin;--dur:8.5s;--delay:2.6s;--peak:.65;--glow:var(--glow-b)"></span>
    <span style="--x:63%;--y:76%;--s:11vmin;--dur:6s;--delay:4.2s;--peak:.7;--glow:var(--glow-a)"></span>
    <span style="--x:12%;--y:82%;--s:9vmin;--dur:9.5s;--delay:5s;--peak:.55;--glow:var(--glow-a)"></span>
    <span style="--x:46%;--y:88%;--s:9vmin;--dur:7s;--delay:2.1s;--peak:.6;--glow:var(--glow-b)"></span>
    <span style="--x:93%;--y:9%;--s:8vmin;--dur:8s;--delay:3.8s;--peak:.55;--glow:var(--glow-a)"></span>
  </div>
  <div class="hero__inner">
    <h1>빛으로 그린 정원을 거닐다</h1>
    <a class="book" href="#">예매하기</a>
    <p class="price">성인 22,000원 · 청소년 16,000원 <em>· 8세 미만 무료</em></p>
  </div>
  <div class="lumi">
    <span class="lumi__halo" aria-hidden="true"></span>
    <img class="lumi__img" src="lumi.webp" alt="전시 마스코트 루미">
  </div>
</main>

<section class="works">
  <h2>세 명의 작가가 빛과 소리로 가꾼 사계절의 정원</h2>
  <div class="grid">
    <a class="card" href="#">
      <figure style="margin:0">
        <img src="work1.webp" alt="작품 흐르는 빛">
        <figcaption><b>흐르는 빛</b> <span>· 서지우</span></figcaption>
      </figure>
    </a>
    <a class="card" href="#">
      <figure style="margin:0">
        <img src="work2.webp" alt="작품 밤의 산책">
        <figcaption><b>밤의 산책</b> <span>· 한도현</span></figcaption>
      </figure>
    </a>
    <a class="card" href="#">
      <figure style="margin:0">
        <img src="work3.webp" alt="작품 파동의 숲">
        <figcaption><b>파동의 숲</b> <span>· 문세린</span></figcaption>
      </figure>
    </a>
  </div>
</section>

<footer class="foot">© 2026 빛의 정원 · 광주 미디어아트 플랫폼</footer>

<script src="brand.js"></script>
</body>
</html>
